<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MUFC Shopping Cart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Manchester United–themed CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Manchester United Cart</h1>

    <!-- Cart Item #1 -->
    <div class="cart-item">
      <button class="delete">🗑️</button>
      <button class="like">♡</button>
      <span class="item-name">Home Jersey 2024/25</span>
      <button class="minus">–</button>
      <span class="item-qty">1</span>
      <button class="plus">+</button>
      <span class="item-price">79.99</span>
      <span class="item-total">79.99</span>
    </div>

    <!-- Cart Item #2 -->
    <div class="cart-item">
      <button class="delete">🗑️</button>
      <button class="like">♡</button>
      <span class="item-name">MUFC Scarf</span>
      <button class="minus">–</button>
      <span class="item-qty">2</span>
      <button class="plus">+</button>
      <span class="item-price">24.50</span>
      <span class="item-total">49.00</span>
    </div>

    <!-- Cart Item #3 -->
    <div class="cart-item">
      <button class="delete">🗑️</button>
      <button class="like">♡</button>
      <span class="item-name">Retro Cap</span>
      <button class="minus">–</button>
      <span class="item-qty">1</span>
      <button class="plus">+</button>
      <span class="item-price">29.99</span>
      <span class="item-total">29.99</span>
    </div>

    <!-- Cart Footer / Grand Total -->
    <div class="cart-footer">
      Total: $<span id="cart-grand-total">0.00</span>
    </div>
  </div>

  <!-- Cart functionality JavaScript -->
  <script src="cart.js"></script>
</body>
</html>
